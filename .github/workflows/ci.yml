name: PD3 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine unit tests
        run: npm test
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Next.js build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile player journeys
        run: npm run test:e2e
  image-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r workers/image-pipeline/requirements.txt
      - run: python -m unittest discover -s workers/image-pipeline -p 'test_*.py'
