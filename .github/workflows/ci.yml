name: PD3 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine unit tests
        run: npm test
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Next.js build
        run: npm run build
